name: Update profile art

on:
  schedule:
    - cron: "17 2 * * *" # daily 02:17 UTC (fresh contributions)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build ASCII + heatmap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: glainejustin
        run: |
          python scripts/make_glaine_ascii.py
          python scripts/build_contrib_heatmap.py
          echo "--- artefacts ---"
          ls -lh *.svg
      - name: Commit if changed
        run: |
          git config user.name "glainejustin"
          git config user.email "glaine100justin@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(profile): refresh ascii + contrib heatmap"
            git push
          fi
